<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBS - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Animated Background Elements */
        body::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.2) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .grid-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            perspective: 1000px;
            transform: rotateX(60deg);
            z-index: -1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) rotateX(60deg); }
            100% { transform: translateY(50px) rotateX(60deg); }
        }

        /* Container & Glassmorphism */
        .container {
            width: 95%;
            max-width: 900px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(40px);
            border-radius: 32px;
            box-shadow: 0 0 80px rgba(99, 102, 241, 0.3), 0 0 0 1px rgba(99, 102, 241, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
        }

        .header h1 {
            font-size: 32px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .logout-btn:hover { background: #ef4444; color: white; }

        .content { padding: 40px; }

        .welcome-section { text-align: center; margin-bottom: 30px; }
        .welcome-section h2 { color: #fff; font-size: 24px; margin-bottom: 5px; }
        .welcome-section p { color: #a5b4fc; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        /* Balance Card */
        .account-balance {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 40px;
        }

        .balance-amount {
            font-size: 56px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
            margin-top: 10px;
        }

        /* Action Buttons */
        .transaction-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .btn-action {
            padding: 20px;
            border: none;
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #e0e7ff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: #0f172a;
            padding: 40px;
            border-radius: 28px;
            border: 1px solid #6366f1;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.3);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #a5b4fc; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 14px; border-radius: 12px;
            background: rgba(30, 41, 59, 1); border: 1px solid rgba(99, 102, 241, 0.4);
            color: #fff; outline: none;
        }
        input:focus { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }

        .message { padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; text-align: center; font-size: 14px; }
        .message.success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid #10b981; }
        .message.error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid #ef4444; }
        .message.show { display: block; }
    </style>
</head>
<body>
<div class="grid-background"></div>

<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>VBS</h1>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="content">
        <div class="welcome-section">
            <h2 id="welcomeText">Welcome</h2>
            <p>User ID: <strong id="userId" style="color: #fff;">-</strong></p>
        </div>

        <div id="dashMessage" class="message"></div>

        <div class="account-balance">
            <p style="color: #a5b4fc; text-transform: uppercase; letter-spacing: 2px; font-size: 12px;">Available Balance</p>
            <div class="balance-amount">₹ <span id="balance">0.00</span></div>
        </div>

        <div class="transaction-buttons">
            <button class="btn-action" onclick="openWithdrawModal()">Withdraw</button>
            <button class="btn-action" onclick="openDepositModal()">Deposit</button>
            <button class="btn-action" onclick="openTransferModal()">Transfer</button>
            <button class="btn-action" onclick="goToPassbook()">Passbook</button>
            <button class="btn-action" onclick="openUpdateModal()">Update Profile</button>
        </div>
    </div>
</div>

<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h2 style="color: #fff; margin-bottom: 20px;">Withdraw Funds</h2>
        <div id="withdrawMessage" class="message"></div>
        <form id="withdrawForm">
            <div class="form-group">
                <label for="withdrawAmount">Amount</label>
                <input type="number" id="withdrawAmount" step="0.01" required>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-action" style="flex:1; background: #6366f1;">Confirm</button>
                <button type="button" class="btn-action" style="flex:1;" onclick="closeWithdrawModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<div id="depositModal" class="modal">
    <div class="modal-content">
        <h2 style="color: #fff; margin-bottom: 20px;">Deposit Funds</h2>
        <div id="depositMessage" class="message"></div>
        <form id="depositForm">
            <div class="form-group">
                <label for="depositAmount">Amount</label>
                <input type="number" id="depositAmount" step="0.01" required>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-action" style="flex:1; background: #6366f1;">Confirm</button>
                <button type="button" class="btn-action" style="flex:1;" onclick="closeDepositModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<div id="transferModal" class="modal">
    <div class="modal-content">
        <h2 style="color: #fff; margin-bottom: 20px;">Transfer Funds</h2>
        <div id="transferMessage" class="message"></div>
        <form id="transferForm">
            <div class="form-group">
                <label for="transferUsername">Recipient Username</label>
                <input type="text" id="transferUsername" required>
            </div>
            <div class="form-group">
                <label for="transferAmount">Amount</label>
                <input type="number" id="transferAmount" step="0.01" required>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-action" style="flex:1; background: #6366f1;">Send</button>
                <button type="button" class="btn-action" style="flex:1;" onclick="closeTransferModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<div id="updateModal" class="modal">
    <div class="modal-content">
        <h2 style="color: #fff; margin-bottom: 20px;">Update Profile</h2>
        <div id="updateMessage" class="message"></div>
        <form id="updateForm">
            <div class="form-group">
                <label for="updateKey">Field</label>
                <select id="updateKey" required>
                    <option value="name">Name</option>
                    <option value="password">Password</option>
                    <option value="email">Email</option>
                </select>
            </div>
            <div class="form-group">
                <label for="updateValue">New Value</label>
                <input type="text" id="updateValue" required>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-action" style="flex:1; background: #6366f1;">Update</button>
                <button type="button" class="btn-action" style="flex:1;" onclick="closeUpdateModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8081';
    let userId = localStorage.getItem("userId");
    let role = localStorage.getItem("role") || 'customer';

    async function loadDashboard() {
        if (!userId) { window.location.href = 'login.html'; return; }
        document.getElementById('userId').textContent = userId;
        try {
            const res = await fetch(`${API_URL}/get-details/${userId}`);
            const data = await res.json();
            document.getElementById('welcomeText').textContent = `Welcome ${data.username}`;
            document.getElementById('balance').textContent = data.balance.toFixed(2);
        } catch (e) { showMessage('dashMessage', 'Failed to load data', 'error'); }
    }

    function showMessage(id, text, type) {
        const el = document.getElementById(id);
        if(!el) return;
        el.textContent = text;
        el.className = `message ${type} show`;
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        setTimeout(() => el.classList.remove('show'), 3000);
    }

    // Form Handlers
    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        try {
            const res = await fetch(`${API_URL}/withdraw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(userId), amount })
            });
            const result = await res.text();
            if (result.toLowerCase().includes('withdrawal')) {
                showMessage('dashMessage', 'Withdrawal successful!', 'success');
                closeWithdrawModal();
                loadDashboard();
            } else {
                showMessage('withdrawMessage', result, 'error');
            }
        } catch (err) { showMessage('withdrawMessage', 'Error processing request', 'error'); }
    });

    document.getElementById('depositForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const amount = parseFloat(document.getElementById('depositAmount').value);
        try {
            const res = await fetch(`${API_URL}/deposit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(userId), amount })
            });
            const result = await res.text();
            if (result.toLowerCase().includes('deposit')) {
                showMessage('dashMessage', 'Deposit successful!', 'success');
                closeDepositModal();
                loadDashboard();
            } else {
                showMessage('depositMessage', result, 'error');
            }
        } catch (err) { showMessage('depositMessage', 'Error processing request', 'error'); }
    });

    document.getElementById('transferForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const amount = parseFloat(document.getElementById('transferAmount').value);
        const username = document.getElementById('transferUsername').value;
        try {
            const res = await fetch(`${API_URL}/transfer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(userId), amount, username })
            });
            const result = await res.text();
            if (result.toLowerCase().includes('successfully')) {
                showMessage('dashMessage', 'Transfer successful!', 'success');
                closeTransferModal();
                loadDashboard();
            } else {
                showMessage('transferMessage', result, 'error');
            }
        } catch (err) { showMessage('transferMessage', 'Error processing request', 'error'); }
    });

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const key = document.getElementById('updateKey').value;
        const value = document.getElementById('updateValue').value;
        try {
            const res = await fetch(`${API_URL}/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(userId), key, value })
            });
            const result = await res.text();
            if (result.toLowerCase().includes('successfully')) {
                showMessage('dashMessage', 'Update successful!', 'success');
                closeUpdateModal();
                loadDashboard();
            } else {
                showMessage('updateMessage', result, 'error');
            }
        } catch (err) { showMessage('updateMessage', 'Error processing request', 'error'); }
    });

    function logout() { localStorage.clear(); window.location.href = 'home.html'; }
    function goToPassbook() { window.location.href = `passbook.html?id=${userId}&role=${role}`; }

    // Modal Controls
    function openWithdrawModal() { document.getElementById('withdrawModal').classList.add('show'); }
    function closeWithdrawModal() {
        document.getElementById('withdrawModal').classList.remove('show');
        document.getElementById('withdrawMessage').classList.remove('show');
        document.getElementById('withdrawForm').reset();
    }

    function openDepositModal() { document.getElementById('depositModal').classList.add('show'); }
    function closeDepositModal() {
        document.getElementById('depositModal').classList.remove('show');
        document.getElementById('depositMessage').classList.remove('show');
        document.getElementById('depositForm').reset();
    }

    function openTransferModal() { document.getElementById('transferModal').classList.add('show'); }
    function closeTransferModal() {
        document.getElementById('transferModal').classList.remove('show');
        document.getElementById('transferMessage').classList.remove('show');
        document.getElementById('transferForm').reset();
    }

    function openUpdateModal() { document.getElementById('updateModal').classList.add('show'); }
    function closeUpdateModal() {
        document.getElementById('updateModal').classList.remove('show');
        document.getElementById('updateMessage').classList.remove('show');
        document.getElementById('updateForm').reset();
    }

    window.onload = loadDashboard;
</script>
</body>
</html>
