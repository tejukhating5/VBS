<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passbook - Virtual Banking System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Animated Background Elements */
        body::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.2) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .grid-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            perspective: 1000px;
            transform: rotateX(60deg);
            z-index: -1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0) rotateX(60deg); }
            100% { transform: translateY(50px) rotateX(60deg); }
        }

        /* Container & Glassmorphism */
        .container {
            width: 95%;
            max-width: 1000px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(40px);
            border-radius: 32px;
            box-shadow: 0 0 80px rgba(99, 102, 241, 0.3), 0 0 0 1px rgba(99, 102, 241, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
        }

        .header h1 {
            font-size: 32px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header div { display: flex; gap: 10px; }

        .btn-header {
            padding: 10px 20px;
            background: rgba(30, 41, 59, 0.6);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 130px;
        }

        .btn-header:hover {
            background: #6366f1;
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .content { padding: 40px; }

        .passbook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .passbook-header h2 {
            color: #fff;
            font-size: 28px;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #fff;
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
        }

        .balance-card p { color: #a5b4fc; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .balance-card .amount {
            font-size: 32px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        /* Transaction List */
        .transactions-section {
            background: rgba(30, 41, 59, 0.4);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .transactions-list { display: flex; flex-direction: column; gap: 12px; }

        .transaction-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .transaction-item:hover {
            transform: scale(1.01);
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .transaction-item.deposit { border-left: 5px solid #43e97b; }
        .transaction-item.withdrawal { border-left: 5px solid #f5576c; }
        .transaction-item.transfer { border-left: 5px solid #4facfe; }

        .transaction-info { display: flex; gap: 15px; align-items: center; }

        .transaction-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .deposit .transaction-icon { background: rgba(67, 233, 123, 0.1); color: #43e97b; }
        .withdrawal .transaction-icon { background: rgba(245, 87, 108, 0.1); color: #f5576c; }
        .transfer .transaction-icon { background: rgba(79, 172, 254, 0.1); color: #4facfe; }

        .transaction-details .type { font-weight: 600; color: #fff; font-size: 15px; }
        .transaction-details .date { font-size: 12px; color: #94a3b8; margin-top: 2px; }

        .transaction-right { text-align: right; }

        .transaction-amount { font-size: 17px; font-weight: 700; }
        .deposit .transaction-amount { color: #43e97b; }
        .withdrawal .transaction-amount { color: #f5576c; }
        .transfer .transaction-amount { color: #4facfe; }

        .balance-display { font-size: 12px; color: #64748b; margin-top: 4px; }

        /* Pagination */
        .pagination {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .pagination button {
            padding: 10px 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pagination .active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .pagination button:hover:not(.active) {
            background: rgba(99, 102, 241, 0.2);
            color: #fff;
        }

        @media (max-width: 600px) {
            .passbook-header { flex-direction: column; text-align: center; }
            .transaction-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .transaction-right { text-align: left; }
        }
    </style>
</head>
<body>
<div class="grid-background"></div>
<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>VBS</h1>
        </div>
        <div>
            <a id="dashLink" class="btn-header">← Dashboard</a>
            <button class="btn-header" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="content">
        <div class="passbook-header">
            <h2>Your Passbook</h2>
            <div class="balance-card">
                <p>Current Balance</p>
                <div class="amount">₹<span id="currentBalance">0.00</span></div>
            </div>
        </div>

        <div class="transactions-section">
            <div id="transactionsList" class="transactions-list"></div>
            <div id="paginationControls" class="pagination"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8081';
    let userId, role;
    let transactions = [];
    let currentPage = 1;
    const itemsPerPage = 10;

    function getUserIdFromURL(){
        const p = new URLSearchParams(window.location.search);
        userId = p.get('id');
        role = p.get('role') || 'customer';
        if(!userId) location.href='login.html';
        document.getElementById('dashLink').href =
            `dashboard.html?id=${userId}&role=${encodeURIComponent(role)}`;
    }

    async function loadPassbook(){
        const r = await fetch(`${API_URL}/passbook/${userId}`);
        transactions = await r.json();
        if(transactions.length)
            document.getElementById('currentBalance').textContent =
                transactions[transactions.length-1].currBalance.toFixed(2);
        render();
    }

    function getType(d){
        d=d.toLowerCase();
        if(d.includes('deposit')) return 'deposit';
        if(d.includes('withdrawal')) return 'withdrawal';
        return 'transfer';
    }

    function render(){
        const list = document.getElementById('transactionsList');
        const pag = document.getElementById('paginationControls');

        const sorted=[...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
        const totalPages=Math.ceil(sorted.length/itemsPerPage);
        const slice=sorted.slice((currentPage-1)*itemsPerPage,currentPage*itemsPerPage);

        list.innerHTML=slice.map(t=>{
            const type = getType(t.description);

            let sign = '-';
            if(type === 'deposit') sign = '+';
            else if(type === 'transfer' && t.description.toLowerCase().includes('received'))
                sign = '+';

            const icon = type==='deposit'?'📥':type==='withdrawal'?'💸':'🔁';

            return `
            <div class="transaction-item ${type}">
                <div class="transaction-info">
                    <div class="transaction-icon">${icon}</div>
                    <div class="transaction-details">
                        <div class="type">${t.description}</div>
                        <div class="date">${new Date(t.date).toLocaleString('en-IN')}</div>
                    </div>
                </div>
                <div class="transaction-right">
                    <div class="transaction-amount">${sign}₹${t.amount.toFixed(2)}</div>
                    <div class="balance-display">Balance ₹${t.currBalance.toFixed(2)}</div>
                </div>
            </div>`;
        }).join('');

        pag.innerHTML='';
        for(let i=1;i<=totalPages;i++){
            pag.innerHTML+=`<button class="${i===currentPage?'active':''}" onclick="go(${i})">${i}</button>`;
        }
    }

    function go(p){currentPage=p;render()}
    function logout(){location.href='home.html'}

    window.onload=()=>{
        getUserIdFromURL();
        loadPassbook();
    }
</script>
</body>
</html>
