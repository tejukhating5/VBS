<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBS - Home</title>
    <style>
        /* Shared CSS for all files */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }
        body::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.2) 0%, transparent 50%);
            z-index: -2;
        }
        .grid-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
            background-size: 50px 50px; animation: gridMove 20s linear infinite;
            perspective: 1000px; transform: rotateX(60deg); z-index: -1;
        }
        @keyframes gridMove { 0% { transform: translateY(0) rotateX(60deg); } 100% { transform: translateY(50px) rotateX(60deg); } }
        .container {
            width: 90%; max-width: 500px; background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(40px); border-radius: 32px;
            box-shadow: 0 0 80px rgba(99, 102, 241, 0.3), 0 0 0 1px rgba(99, 102, 241, 0.3);
            overflow: hidden; position: relative; z-index: 1;
        }
        .header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
            padding: 40px; text-align: center; border-bottom: 1px solid rgba(99, 102, 241, 0.3);
        }
        .header h1 { font-size: 42px; letter-spacing: 6px; background: linear-gradient(135deg, #fff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .content { padding: 40px; text-align: center; }
        h2 { color: #fff; margin-bottom: 20px; font-size: 24px; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; font-weight: 700; cursor: pointer; transition: 0.4s; text-transform: uppercase; margin-bottom: 10px; }
        .btn:hover { transform: translateY(-4px); box-shadow: 0 0 50px rgba(99, 102, 241, 0.6); }
        .btn-secondary { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body>
<div class="grid-background"></div>
<div class="container">
    <div class="header">
        <h1>VBS</h1>
        <p style="color: #a5b4fc; letter-spacing: 2px;">Virtual Banking System</p>
    </div>
    <div class="content">
        <h2>Welcome to VBS</h2>
        <p style="color: #94a3b8; line-height: 1.6; margin-bottom: 30px;">Experience secure and convenient banking at your fingertips.</p>
        <button class="btn" onclick="window.location.href='login.html'">Login</button>
        <button class="btn btn-secondary" onclick="window.location.href='signup.html'">Sign Up</button>
    </div>
</div>
</body>
</html>
